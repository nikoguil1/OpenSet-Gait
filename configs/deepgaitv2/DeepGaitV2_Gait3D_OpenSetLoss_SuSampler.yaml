# DeepGaitV2 + OpenSetLoss on Gait3D with the training batches of Su et al., ECCV 2024
# (github.com/prevso1088/open-set-biometrics, commit 76ea429, configs/gaitbase_gait3d_open_set.yaml).
# Changes from DeepGaitV2_Gait3D_OpenSetLoss.yaml: sampler TripletNoRepeatSampler (128 distinct sequences,
# up to 4 per subject) and loss TripletLossSu (accepts subjects with fewer than K sequences); frames
# unfixed_ordered 10-50 with one length per batch (they use unfixed_unordered for the 2D GaitBase,
# ordered here because DeepGaitV2 has 3D convolutions) and frames_skip_num: 0 as in their SwinGait.
# Gradient checkpointing (use_checkpoint): 32 sequences x 50 frames per GPU do not fit in 24 GB.
data_cfg:
  dataset_name: Gait3D
  dataset_root: /home/nico/gait/datasets/Gait3D/Gait3D-pkls/Gait3D-sils-64-44-pkl
  dataset_partition: ./datasets/Gait3D/Gait3D.json
  num_workers: 1
  remove_no_gallery: false # Remove probe if no gallery for it
  test_dataset_name: Gait3D

evaluator_cfg:
  enable_float16: true
  restore_ckpt_strict: true
  restore_hint: 60000
  save_name: DeepGaitV2_OpenSetLoss_SuSampler
  eval_func: evaluate_Gait3D
  sampler:
    batch_shuffle: false
    batch_size: 4
    sample_type: all_ordered # all indicates whole sequence used to test, while ordered means input sequence by its natural order; Other options:   fixed_unordered
    frames_all_limit: 720 # limit the number of sampled frames to prevent out of memory
  metric: euc # cos
  transform:
    - type: BaseSilCuttingTransform

loss_cfg:
  - loss_term_weight: 1.0
    margin: 0.2
    type: TripletLossSu
    log_prefix: triplet
  - loss_term_weight: 1.0
    scale: 16
    type: CrossEntropyLoss
    log_prefix: softmax
    log_accuracy: true
  # Su et al., ECCV 2024 (arXiv 2407.16133): IDL + RTM, hyperparameters of GaitBase on Gait3D
  # (Supp. Tab. 1): alpha = score_scale, beta = rank_scale, gamma = rank_diff_scale, lambda = rtm_weight
  - loss_term_weight: 1.0
    type: OpenSetLoss
    num_folds: 4
    rank: 1
    score_scale: 6.0
    rank_scale: 0.2
    rank_diff_scale: 6.0
    rtm_weight: 4.0
    num_parts: 16
    log_prefix: open_set

model_cfg:
  model: DeepGaitV2
  Backbone:
    in_channels: 1
    mode: p3d
    use_checkpoint: true # same gradients, fits 50 frames in 24 GB
    layers: 
      - 1
      - 4
      - 4
      - 1
    channels: 
      - 64
      - 128
      - 256
      - 512
  SeparateBNNecks:
    class_num: 3000
  open_set_loss: true

optimizer_cfg:
  lr: 0.1
  momentum: 0.9
  solver: SGD
  weight_decay: 0.0005

scheduler_cfg:
  gamma: 0.1
  milestones: # Learning Rate Reduction at each milestones
    - 20000
    - 40000
    - 50000
  scheduler: MultiStepLR

trainer_cfg:
  enable_float16: true # half_percesion float for memory reduction and speedup
  fix_BN: false
  log_iter: 100
  with_test: false
  restore_ckpt_strict: true
  restore_hint: 0
  save_iter: 30000
  save_name: DeepGaitV2_OpenSetLoss_SuSampler
  sync_BN: true
  total_iter: 60000
  sampler:
    batch_shuffle: true
    batch_size:
      - 32 # TripletSampler, batch_size[0] indicates Number of Identity
      - 4 #                 batch_size[1] indicates Samples sequqnce for each Identity
    frames_num_max: 50 # max frames number for unfixed training
    frames_num_min: 10 # min frames number for unfixed training
    frames_num_per_batch: true
    frames_skip_num: 0 # skip frames number for ordered training
    sample_type: unfixed_ordered # fixed control input frames number, unordered for controlling order of input tensor; Other options: unfixed_ordered or all_ordered
    type: TripletNoRepeatSampler
  transform:
    - type: Compose
      trf_cfg:
        - type: RandomPerspective
          prob: 0.2
        - type: BaseSilCuttingTransform
        - type: RandomHorizontalFlip
          prob: 0.2
        - type: RandomRotate
          prob: 0.2