# GaitBase + Triplet + CE + open-pair loss (lambda = 0.5) on GREW, for picasso (SCBI, Slurm) with 4 GPUs.
# OpenGait's configs/gaitbase/gaitbase_da_grew.yaml with the open-pair loss added (opengait/modeling/losses/open_pair.py:
# 4-fold mated / non-mated split, raw Euclidean distance, m_open = 0.2, active-pair mean). Training recipe unchanged:
# 32x4 batches, 20-40 frames, SGD lr 0.1, MultiStepLR 80k/120k/150k, 180k iterations, sync_BN.
# Sampler of Su et al. (TripletNoRepeatSampler + TripletLossSu) instead of OpenGait's TripletSampler + TripletLoss:
#   31 % of GREW train subjects have < 4 sequences and TripletSampler repeats them, so the same sequence would be both
#   in a gallery template and a mated probe of the open-pair loss. Subjects with < 4 sequences add what they have and
#   the batch (128 sequences) is filled with more subjects.
# Other changes (no effect on training): dataset_root placeholder, local test split + evaluate_GREW, evaluator
# batch_size = number of GPUs, num_workers 4 (OpenGait: 1), save_iter 10000 (OpenGait: 60000), tb_scalar_iter 1.
# 4 GPUs x 32 sequences = same global batch as 8 x 16 (losses gather the whole batch, DDP averages, sync_BN).
# Launch: sbatch -J GaitBase_GREW_OpenPair --gres=gpu:4 --cpus-per-task=32 --mem=200G \
#   --export=ALL,DATASET=GREW,CFG_FILE=configs/gaitbase/GaitBase_GREW_OpenPair_picasso.yaml ~/OpenSetGait/picasso/run_experiments.sh
data_cfg:
  dataset_name: GREW
  dataset_root: DATASET_ROOT # set by picasso/run_experiments.sh
  dataset_partition: ./datasets/GREW/GREW_local_test.json # same TRAIN_SET as GREW.json; local test split
  num_workers: 4
  remove_no_gallery: false # Remove probe if no gallery for it
  test_dataset_name: GREW

evaluator_cfg:
  enable_float16: true
  restore_ckpt_strict: true
  restore_hint: 180000
  save_name: GaitBase_GREW_OpenPair
  eval_func: evaluate_GREW # closed + open-set metrics on the local split (GREW_submission only writes a file)
  sampler:
    batch_shuffle: false
    batch_size: 4 # number of GPUs
    sample_type: all_ordered # all indicates whole sequence used to test, while ordered means input sequence by its natural order; Other options:   fixed_unordered
    frames_all_limit: 720 # limit the number of sampled frames to prevent out of memory
  metric: euc # cos
  transform:
    - type: BaseSilCuttingTransform

loss_cfg:
  - loss_term_weight: 1.0
    margin: 0.2
    type: TripletLossSu # Su's triplet: anchor by anchor, for unbalanced batches (TripletNoRepeatSampler)
    log_prefix: triplet
  - loss_term_weight: 1.0
    scale: 16
    type: CrossEntropyLoss
    log_prefix: softmax
    log_accuracy: true
  # open-pair loss (lambda = 0.5), the only change in the training recipe
  - loss_term_weight: 0.5
    type: OpenPairLoss
    num_folds: 4
    margin: 0.2
    reduction: nonzero
    log_prefix: open_set
model_cfg:
  model: Baseline
  backbone_cfg:
    type: ResNet9
    block: BasicBlock
    channels: # Layers configuration for automatically model construction
      - 64
      - 128
      - 256
      - 512
    layers:
      - 1
      - 1
      - 1
      - 1
    strides:
      - 1
      - 2
      - 2
      - 1
    maxpool: false
  SeparateFCs:
    in_channels: 512
    out_channels: 256
    parts_num: 16
  SeparateBNNecks:
    class_num: 20000
    in_channels: 256
    parts_num: 16
  bin_num:
    - 16
  open_set_loss: true # feed embed_1 to the open-pair loss
optimizer_cfg:
  lr: 0.1
  momentum: 0.9
  solver: SGD
  weight_decay: 0.0005

scheduler_cfg:
  gamma: 0.1
  milestones: # Learning Rate Reduction at each milestones
    - 80000
    - 120000
    - 150000
  scheduler: MultiStepLR
trainer_cfg:
  enable_float16: true # half_percesion float for memory reduction and speedup
  fix_BN: false
  with_test: false
  log_iter: 100
  tb_scalar_iter: 1 # every loss scalar to TensorBoard each iteration
  restore_ckpt_strict: true
  restore_hint: 0
  save_iter: 10000 # (OpenGait: 60000) the picasso job resumes from the last checkpoint
  save_name: GaitBase_GREW_OpenPair
  sync_BN: true
  total_iter: 180000
  sampler:
    batch_shuffle: true
    batch_size:
      - 32 # TripletSampler, batch_size[0] indicates Number of Identity
      - 4 #                 batch_size[1] indicates Samples sequqnce for each Identity
    frames_num_fixed: 30 # fixed frames number for training
    frames_num_max: 40 # max frames number for unfixed training
    frames_num_min: 20 # min frames number for unfixed traing
    sample_type: unfixed_unordered # fixed control input frames number, unordered for controlling order of input tensor; Other options: unfixed_ordered or all_ordered
    type: TripletNoRepeatSampler # Su's sampler: no repeated sequences (OpenGait's TripletSampler repeats them)
  transform:
    - type: Compose
      trf_cfg:
        - type: RandomPerspective
          prob: 0.2
        - type: BaseSilCuttingTransform
        - type: RandomHorizontalFlip
          prob: 0.2
        - type: RandomRotate
          prob: 0.2
