# GaitBase + Triplet + CE + OpenSetLoss with the E4.6 recalibration (genuine reference scale) on Gait3D.
# E4.6 on GaitBase: same as GaitBase_Su2024_Gait3D_OpenPair.yaml (port of Su et al. configs/gaitbase_gait3d_open_set.yaml,
# commit 76ea429: Baseline + ResNet9, TripletNoRepeatSampler, TripletLossSu, SGD lr 0.1, 60k iterations) with the
# OpenPairLoss replaced by the OpenSetLoss of SwinGait3D_Su2024_Gait3D_OpenSetLoss_GenNorm_picasso.yaml (E4.6):
#   - scale_invariant + scale_reference: genuine + scale_detach: false: d' = d / mean mated distance, with gradient
#     (exactly scale invariant, no radial gradient);
#   - rank_self_term: false; alpha = 20, beta = 1, gamma = 30, rtm_softmax_scale = 10, lambda_RTM = 4, weight 1;
#   - num_parts: 16 (GaitBase), instead of 15.
# Reference: Su's GaitBase + original OSL (GB-OSL) and without OSL (GB-noOSL), trained with their repository.
data_cfg:
  dataset_name: Gait3D
  dataset_root: /home/nico/gait/datasets/Gait3D/Gait3D-pkls/Gait3D-sils-64-44-pkl
  dataset_partition: ./datasets/Gait3D/Gait3D.json
  num_workers: 4
  remove_no_gallery: false # Remove probe if no gallery for it
  test_dataset_name: Gait3D

evaluator_cfg:
  enable_float16: true
  restore_ckpt_strict: true
  restore_hint: 60000
  save_name: GaitBase_Su2024_OpenSetLoss_GenNorm
  eval_func: evaluate_Gait3D
  sampler:
    batch_shuffle: false
    batch_size: 4
    sample_type: all_ordered
    frames_all_limit: 720 # limit the number of sampled frames to prevent out of memory
  metric: euc
  transform:
    - type: BaseSilTransform

loss_cfg:
  - loss_term_weight: 1.0
    margin: 0.2
    type: TripletLossSu # their triplet: anchor by anchor, for unbalanced batches
    log_prefix: triplet
  - loss_term_weight: 1.0
    scale: 16
    type: CrossEntropyLoss
    log_prefix: softmax
    log_accuracy: true
  # OpenSetLoss with the E4.6 recalibration (genuine reference scale, gradient through the scale)
  - loss_term_weight: 1.0
    type: OpenSetLoss
    num_folds: 4
    rank: 1
    score_scale: 20.0 # alpha
    rank_scale: 1.0 # beta
    rank_diff_scale: 30.0 # gamma
    scale_invariant: true
    rank_self_term: false
    rtm_softmax_scale: 10.0
    scale_reference: genuine # d / mean genuine (mated) distance
    scale_detach: false # gradient through the mean: exactly scale invariant
    rtm_weight: 4.0
    num_parts: 16
    log_prefix: open_set

model_cfg:
  model: Baseline
  backbone_cfg:
    type: ResNet9
    block: BasicBlock
    channels: [64, 128, 256, 512]
    layers: [1, 1, 1, 1]
    strides: [1, 2, 2, 1]
    maxpool: false
  SeparateFCs:
    in_channels: 512
    out_channels: 256
    parts_num: 16
  SeparateBNNecks:
    class_num: 3000
    in_channels: 256
    parts_num: 16
  bin_num:
    - 16
  open_set_loss: true

optimizer_cfg:
  lr: 0.1
  momentum: 0.9
  solver: SGD
  weight_decay: 0.0005

scheduler_cfg:
  gamma: 0.1
  milestones: [20000, 40000, 50000]
  scheduler: MultiStepLR

trainer_cfg:
  enable_float16: true
  fix_BN: false
  with_test: false
  log_iter: 100
  tb_scalar_iter: 1
  restore_ckpt_strict: true
  restore_hint: 0
  save_iter: 20000
  save_name: GaitBase_Su2024_OpenSetLoss_GenNorm
  sync_BN: true
  total_iter: 60000
  sampler:
    batch_shuffle: true
    batch_size:
      - 32 # TripletSampler, batch_size[0] indicates Number of Identity
      - 4 #                 batch_size[1] indicates Samples sequqnce for each Identity
    frames_num_fixed: 30
    frames_num_max: 50
    frames_num_min: 10
    frames_num_per_batch: true
    sample_type: unfixed_unordered
    type: TripletNoRepeatSampler
  transform:
    - type: Compose
      trf_cfg:
        - type: RandomPerspective
          prob: 0.35
        - type: BaseSilTransform
        - type: RandomHorizontalFlip
          prob: 0.35
        - type: RandomRotate
          prob: 0.35
