# GaitBase + Triplet + CE + open-pair loss v2.a (lambda = 0.5) on Gait3D. Same as GaitBase_Su2024_Gait3D_OpenPair_v2.yaml
# (genuine reference scale with gradient + tail of the 25 % closest intruders) plus:
#  - nm_sequences: true (idea 3a): the nearest gallery item of a non-mated probe is searched among the fold templates
#    AND every individual sequence of the known subjects of the batch (~4x more candidates, current model, with
#    gradient), to reduce the extreme-value bias of the in-batch min (24 templates vs ~785 at test).
# save_iter 2000: every checkpoint from 42k to 60k is tested. Trained on poniente (4 GPUs, same global batch).
data_cfg:
  dataset_name: Gait3D
  dataset_root: /home/nico/gait/datasets/Gait3D/Gait3D-pkls/Gait3D-sils-64-44-pkl
  dataset_partition: ./datasets/Gait3D/Gait3D.json
  num_workers: 4
  remove_no_gallery: false # Remove probe if no gallery for it
  test_dataset_name: Gait3D

evaluator_cfg:
  enable_float16: true
  restore_ckpt_strict: true
  restore_hint: 60000
  save_name: GaitBase_Su2024_OpenPair_v2a
  eval_func: evaluate_Gait3D
  sampler:
    batch_shuffle: false
    batch_size: 4
    sample_type: all_ordered
    frames_all_limit: 720 # limit the number of sampled frames to prevent out of memory
  metric: euc
  transform:
    - type: BaseSilTransform

loss_cfg:
  - loss_term_weight: 1.0
    margin: 0.2
    type: TripletLossSu # their triplet: anchor by anchor, for unbalanced batches
    log_prefix: triplet
  - loss_term_weight: 1.0
    scale: 16
    type: CrossEntropyLoss
    log_prefix: softmax
    log_accuracy: true
  # open-pair loss (lambda = 0.5) in place of Su's OpenSetLoss; same folds / gallery-probe split
  - loss_term_weight: 0.5
    type: OpenPairLoss
    num_folds: 4
    margin: 0.2 # same Euclidean space and margin as the triplet
    reduction: nonzero
    scale_reference: genuine # idea 1: relative margin, scale invariant
    scale_detach: false
    tail_frac: 0.25 # idea 2: hardest 25 % of the intruders of each fold
    nm_sequences: true # idea 3a: nearest gallery item among templates + individual known sequences
    log_prefix: open_set

model_cfg:
  model: Baseline
  backbone_cfg:
    type: ResNet9
    block: BasicBlock
    channels: [64, 128, 256, 512]
    layers: [1, 1, 1, 1]
    strides: [1, 2, 2, 1]
    maxpool: false
  SeparateFCs:
    in_channels: 512
    out_channels: 256
    parts_num: 16
  SeparateBNNecks:
    class_num: 3000
    in_channels: 256
    parts_num: 16
  bin_num:
    - 16
  open_set_loss: true

optimizer_cfg:
  lr: 0.1
  momentum: 0.9
  solver: SGD
  weight_decay: 0.0005

scheduler_cfg:
  gamma: 0.1
  milestones: [20000, 40000, 50000]
  scheduler: MultiStepLR

trainer_cfg:
  enable_float16: true
  fix_BN: false
  with_test: false
  log_iter: 100
  tb_scalar_iter: 1
  restore_ckpt_strict: true
  restore_hint: 0
  save_iter: 2000
  save_name: GaitBase_Su2024_OpenPair_v2a
  sync_BN: true
  total_iter: 60000
  sampler:
    batch_shuffle: true
    batch_size:
      - 32 # TripletSampler, batch_size[0] indicates Number of Identity
      - 4 #                 batch_size[1] indicates Samples sequqnce for each Identity
    frames_num_fixed: 30
    frames_num_max: 50
    frames_num_min: 10
    frames_num_per_batch: true
    sample_type: unfixed_unordered
    type: TripletNoRepeatSampler
  transform:
    - type: Compose
      trf_cfg:
        - type: RandomPerspective
          prob: 0.35
        - type: BaseSilTransform
        - type: RandomHorizontalFlip
          prob: 0.35
        - type: RandomRotate
          prob: 0.35
