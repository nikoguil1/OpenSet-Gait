# Strong-scaling timing run (2 x B200), 2026-11-20. Same model, data and recipe as E4.6
# (SwinGait3D_Su2024_Gait3D_OpenSetLoss_GenNorm_picasso.yaml, 8 x B200, 0.296 s/iter), global batch fixed at 128 sequences
# (32 x 4) -> 64 sequences per GPU. Only changes: total_iter 2000, save_iter 10000, save_name, num_workers = 32 / n_gpus
# (32 in total, as E4.6), evaluator batch_size = n_gpus. No gradient checkpointing (if it does not fit: discard the run).
# Launch (QOS short: max 2 h, 4 GPUs per user; same 64 CPUs / 400G as E4.6, B200 only; never --export on picasso):
#   cd ~/fscratch/OpenSetGait/jobs && sbatch job_Scaling_SwinGait3D_2xB200.sh
data_cfg:
  dataset_name: Gait3D
  dataset_root: DATASET_ROOT # set by picasso/run_experiments.sh
  dataset_partition: ./datasets/Gait3D/Gait3D.json
  num_workers: 16 # 32 workers in total, as E4.6 (8 GPUs x 4)
  remove_no_gallery: false # Remove probe if no gallery for it
  test_dataset_name: Gait3D

evaluator_cfg:
  enable_float16: true
  restore_ckpt_strict: true
  restore_hint: 60000
  save_name: Scaling_SwinGait3D_2xB200
  eval_func: evaluate_Gait3D
  sampler:
    batch_shuffle: false
    batch_size: 2 # number of GPUs
    sample_type: all_ordered # all indicates whole sequence used to test, while ordered means input sequence by its natural order; Other options:   fixed_unordered
    frames_all_limit: 720 # limit the number of sampled frames to prevent out of memory
  metric: euc # cos
  transform:
    - type: BaseSilTransform

loss_cfg:
  - loss_term_weight: 1.0
    margin: 0.2
    type: TripletLossSu # their triplet: anchor by anchor, for unbalanced batches
    log_prefix: triplet
  - loss_term_weight: 1.0
    scale: 16
    type: CrossEntropyLoss
    log_prefix: softmax
    log_accuracy: true
  # recalibrated IDL as E4.5, genuine-referenced scale (Su's published config: alpha = gamma = 9, beta = 0.2, raw distances)
  - loss_term_weight: 1.0
    type: OpenSetLoss
    num_folds: 4
    rank: 1
    score_scale: 20.0 # alpha
    rank_scale: 1.0 # beta
    rank_diff_scale: 30.0 # gamma
    scale_invariant: true
    rank_self_term: false
    rtm_softmax_scale: 10.0
    scale_reference: genuine # d / mean mated distance (E4.5: all pairs)
    scale_detach: false # gradient through the mean: exactly scale invariant
    rtm_weight: 4.0
    num_parts: 15
    log_prefix: open_set

model_cfg:
  model: Baseline3D
  backbone_cfg:
    type: SwinGaitSu
    block_2d: BasicBlock
    block_3d: BasicBlock
    conv_3d: Conv3DSimple
    channels: [64, 128, 256, 512]
    in_channel: 1
    layers: [1, 4, 4, 2]
    strides: [1, 2, 2, 1]
    maxpool: false
    use_checkpoint: false # no gradient checkpointing (as E4.6)
  SeparateFCs:
    in_channels: 512
    out_channels: 512
    parts_num: 15
  SeparateBNNecks:
    class_num: 3000
    in_channels: 512
    parts_num: 15
  bin_num:
    - 15
  open_set_loss: true

optimizer_cfg:
  lr: 3.0e-4
  solver: AdamW
  weight_decay: 2.0e-2

scheduler_cfg:
  t_initial: 60000
  scheduler: CosineLRScheduler

trainer_cfg:
  enable_float16: true # half_percesion float for memory reduction and speedup
  fix_BN: false
  with_test: false
  log_iter: 100
  restore_ckpt_strict: true
  restore_hint: 0
  save_iter: 10000 # > total_iter: no checkpoint during the measurement
  save_name: Scaling_SwinGait3D_2xB200
  sync_BN: true
  total_iter: 2000 # timing run: discard iterations 0-200, average the 18 log windows 200-2000
  sampler:
    batch_shuffle: true
    batch_size:
      - 32 # TripletSampler, batch_size[0] indicates Number of Identity
      - 4 #                 batch_size[1] indicates Samples sequqnce for each Identity
    frames_num_max: 50 # max frames number for unfixed training
    frames_num_min: 10 # min frames number for unfixed training
    frames_num_per_batch: true
    frames_skip_num: 0 # skip frames number for ordered training
    sample_type: unfixed_ordered # fixed control input frames number, unordered for controlling order of input tensor; Other options: unfixed_ordered or all_ordered
    type: TripletNoRepeatSampler
  transform:
    - type: Compose
      trf_cfg:
        - type: RandomPerspective
          prob: 0.3
        - type: BaseSilTransform
        - type: RandomHorizontalFlip
          prob: 0.3
        - type: RandomRotate
          prob: 0.3
