# E4.5 on GREW (E4.8): SwinGait3D_Su2024_GREW.yaml (E4.7, GREW counterpart of E4.4) plus the recalibrated
# OpenSetLoss of E4.5 (SwinGait3D_Su2024_Gait3D_OpenSetLoss_Calib.yaml): scale-invariant scores (d / mean d over
# all pairs per part and fold, detached; also in the RTM softmax: softmax(-10 d')), alpha = 20, gamma = 30,
# beta = 1, soft rank without the own-template term, lambda = 4. Logs open_set/Id and open_set/Det.
# Only loss_cfg / open_set_loss / save_name differ from E4.7.
# SwinGait-3D baseline (Triplet + CE) of Su et al., ECCV 2024, on GREW: the GREW counterpart of E4.4
# (SwinGait3D_Su2024_Gait3D.yaml). GREW settings from Su's supplementary Table 1 for SwinGait:
# 20-40 frames, half-cosine schedule of 150k iterations. Everything else as in the Gait3D config
# (AdamW 3e-4, TripletNoRepeatSampler 32x4, TripletLossSu, CE scale 16, augmentation p=0.3, 15 parts).
# Test: local GREW split (gallery 01 / probe 02, 6000 IDs), closed set + open-set protocols (evaluate_GREW).
data_cfg:
  dataset_name: GREW
  dataset_root: /home/GAIT_local/SSD_grande/GREW-pkl/
  dataset_partition: ./datasets/GREW/GREW_local_test.json
  num_workers: 4
  remove_no_gallery: false # Remove probe if no gallery for it
  test_dataset_name: GREW

evaluator_cfg:
  enable_float16: true
  restore_ckpt_strict: true
  restore_hint: 150000
  save_name: SwinGait3D_Su2024_GREW_OpenSetLoss_Calib
  eval_func: evaluate_GREW
  sampler:
    batch_shuffle: false
    batch_size: 4 # number of GPUs
    sample_type: all_ordered # all indicates whole sequence used to test, while ordered means input sequence by its natural order; Other options:   fixed_unordered
    frames_all_limit: 720 # limit the number of sampled frames to prevent out of memory
  metric: euc # cos
  transform:
    - type: BaseSilCuttingTransform # GREW pkls are 64x64; cut to 64x44 as the Gait3D input

loss_cfg:
  - loss_term_weight: 1.0
    margin: 0.2
    type: TripletLossSu # their triplet: anchor by anchor, for unbalanced batches
    log_prefix: triplet
  - loss_term_weight: 1.0
    scale: 16
    type: CrossEntropyLoss
    log_prefix: softmax
    log_accuracy: true

  # recalibrated IDL (Su's published config: alpha = gamma = 9, beta = 0.2, raw distances)
  - loss_term_weight: 1.0
    type: OpenSetLoss
    num_folds: 4
    rank: 1
    score_scale: 20.0 # alpha
    rank_scale: 1.0 # beta
    rank_diff_scale: 30.0 # gamma
    scale_invariant: true
    rank_self_term: false
    rtm_softmax_scale: 10.0
    rtm_weight: 4.0
    num_parts: 15
    log_prefix: open_set

model_cfg:
  model: Baseline3D
  backbone_cfg:
    type: SwinGaitSu
    block_2d: BasicBlock
    block_3d: BasicBlock
    conv_3d: Conv3DSimple
    channels: [64, 128, 256, 512]
    in_channel: 1
    layers: [1, 4, 4, 2]
    strides: [1, 2, 2, 1]
    maxpool: false
    use_checkpoint: true # gradient checkpointing in the Swin layers (4 GPUs x 32 seqs; theirs: 8 x 16)
  SeparateFCs:
    in_channels: 512
    out_channels: 512
    parts_num: 15
  SeparateBNNecks:
    class_num: 20000
    in_channels: 512
    parts_num: 15
  bin_num:
    - 15
  open_set_loss: true

optimizer_cfg:
  lr: 3.0e-4
  solver: AdamW
  weight_decay: 2.0e-2

scheduler_cfg:
  t_initial: 150000
  scheduler: CosineLRScheduler

trainer_cfg:
  enable_float16: true # half_percesion float for memory reduction and speedup
  fix_BN: false
  with_test: false
  log_iter: 100
  restore_ckpt_strict: true
  restore_hint: 0
  save_iter: 10000
  save_name: SwinGait3D_Su2024_GREW_OpenSetLoss_Calib
  sync_BN: true
  total_iter: 150000
  sampler:
    batch_shuffle: true
    batch_size:
      - 32 # TripletSampler, batch_size[0] indicates Number of Identity
      - 4 #                 batch_size[1] indicates Samples sequqnce for each Identity
    frames_num_max: 40 # Su, suppl. Tab. 1 (GREW): 20-40 frames
    frames_num_min: 20
    frames_num_per_batch: true
    frames_skip_num: 0 # skip frames number for ordered training
    sample_type: unfixed_ordered # fixed control input frames number, unordered for controlling order of input tensor; Other options: unfixed_ordered or all_ordered
    type: TripletNoRepeatSampler
  transform:
    - type: Compose
      trf_cfg:
        - type: RandomPerspective
          prob: 0.3
        - type: BaseSilCuttingTransform
        - type: RandomHorizontalFlip
          prob: 0.3
        - type: RandomRotate
          prob: 0.3
