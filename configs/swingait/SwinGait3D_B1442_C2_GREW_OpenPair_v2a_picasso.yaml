# SwinGait-3D on GREW, stage 2 of OpenGait's official recipe, variant (c): + OpenPair v2.a, for picasso
# (8 GPUs x 16 sequences, A100 or B200; launch with a job script and picasso/run_experiments.sh, never sbatch --export).
# Identical to variant (a) (SwinGait3D_B1442_C2_GREW.yaml: init from DeepGaitV2_B1441_C2_P3D-180000.pt, strict false,
# optimizer reset, 200k iterations, AdamW 3e-4, TripletSampler 32x4, 30 fixed frames, TripletLoss + CE) except:
#   - open-pair loss v2.a (lambda 0.5, genuine scale, tail_frac 0.25, nm_sequences), same parameters as
#     SwinGait3D_Su2024_GREW_OpenPair_v2a_picasso.yaml; model_cfg.open_set_loss true.
#   - dataset_root DATASET_ROOT (node local scratch), evaluator batch_size 8, save_iter 10000, save_name.
#   - run_experiments.sh resumes from the last own checkpoint (then optimizer_reset false) if the job is relaunched.
data_cfg:
  dataset_name: GREW
  dataset_root: DATASET_ROOT # set by picasso/run_experiments.sh
  dataset_partition: ./datasets/GREW/GREW_local_test.json
  num_workers: 4
  remove_no_gallery: false # Remove probe if no gallery for it
  test_dataset_name: GREW

evaluator_cfg:
  enable_float16: true
  restore_ckpt_strict: true
  restore_hint: 200000
  save_name: SwinGait3D_B1442_C2_GREW_OpenPair_v2a
  sampler:
    batch_shuffle: false
    batch_size: 8 # number of GPUs
    sample_type: all_ordered # all indicates whole sequence used to test, while ordered means input sequence by its natural order; Other options:   fixed_unordered
    frames_all_limit: 720 # limit the number of sampled frames to prevent out of memory
  eval_func: evaluate_GREW
  metric: euc # cos
  transform:
    - type: BaseSilCuttingTransform

loss_cfg:
  - loss_term_weight: 1.0
    margin: 0.2
    type: TripletLoss
    log_prefix: triplet
  - loss_term_weight: 1.0
    scale: 16
    type: CrossEntropyLoss
    log_prefix: softmax
    log_accuracy: true
  # open-pair loss v2.a (lambda = 0.5); same folds / gallery-probe split as Su's OpenSetLoss
  - loss_term_weight: 0.5
    type: OpenPairLoss
    num_folds: 4
    margin: 0.2 # same Euclidean space and margin as the triplet
    reduction: nonzero
    scale_reference: genuine # idea 1: relative margin, scale invariant
    scale_detach: false
    tail_frac: 0.25 # idea 2: hardest 25 % of the intruders of each fold
    nm_sequences: true # idea 3a: nearest gallery item among templates + individual known sequences
    log_prefix: open_set

model_cfg:
  model: SwinGait
  open_set_loss: true # adds the 'open_set' training feature (triplet embeddings)
  use_checkpoint: true # gradient checkpointing: 16 seqs/GPU fit in an A100-40GB (~15 GB)
  Backbone:
    mode: p3d
    in_channels: 1
    layers:
      - 1
      - 4
      - 4
      - 2
    channels:
      - 64
      - 128
  bin_num: 
    - 15
  SeparateBNNecks:
    in_channels: 256
    class_num: 20000
    parts_num: 16

optimizer_cfg:
  lr: 0.0003
  solver: AdamW
  weight_decay: 0.02

scheduler_cfg:
  gamma: 0.1
  milestones: # Learning Rate Reduction at each milestones
    - 100000000
  scheduler: MultiStepLR

trainer_cfg:
  enable_float16: true # half_percesion float for memory reduction and speedup
  fix_BN: false
  log_iter: 100
  with_test: false
  optimizer_reset: True
  restore_ckpt_strict: false
  restore_hint: ./output/GREW/DeepGaitV2/DeepGaitV2_B1441_C2_P3D/checkpoints/DeepGaitV2_B1441_C2_P3D-180000.pt
  save_iter: 10000
  save_name: SwinGait3D_B1442_C2_GREW_OpenPair_v2a
  sync_BN: true
  T_max_iter: 150000
  total_iter: 200000
  sampler:
    batch_shuffle: true
    batch_size:
      - 32 # TripletSampler, batch_size[0] indicates Number of Identity
      - 4 #                 batch_size[1] indicates Samples sequqnce for each Identity
    frames_num_fixed: 30 # fixed frames number for training
    frames_skip_num: 4
    sample_type: fixed_ordered # fixed control input frames number, unordered for controlling order of input tensor; Other options: unfixed_ordered or all_ordered
    type: TripletSampler
  transform:
    - type: Compose
      trf_cfg:
        - type: RandomPerspective
          prob: 0.2
        - type: BaseSilCuttingTransform
        - type: RandomHorizontalFlip
          prob: 0.2
        - type: RandomRotate
          prob: 0.2


