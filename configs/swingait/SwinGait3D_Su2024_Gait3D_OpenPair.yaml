# SwinGait-3D + Triplet + CE + open-pair loss (lambda = 0.5) on Gait3D.
# Same as SwinGait3D_Su2024_Gait3D_OpenSetLoss.yaml (Su et al., ECCV 2024 setup: 32x4 batches, Euclidean
# distance, 4-fold mated / non-mated split) with Su's OpenSetLoss replaced by OpenPairLoss
# (opengait/modeling/losses/open_pair.py). Only loss_cfg and save_name differ.
data_cfg:
  dataset_name: Gait3D
  dataset_root: /home/nico/gait/datasets/Gait3D/Gait3D-pkls/Gait3D-sils-64-44-pkl
  dataset_partition: ./datasets/Gait3D/Gait3D.json
  num_workers: 4
  remove_no_gallery: false # Remove probe if no gallery for it
  test_dataset_name: Gait3D

evaluator_cfg:
  enable_float16: true
  restore_ckpt_strict: true
  restore_hint: 60000
  save_name: SwinGait3D_Su2024_OpenPair
  eval_func: evaluate_Gait3D
  sampler:
    batch_shuffle: false
    batch_size: 4
    sample_type: all_ordered # all indicates whole sequence used to test, while ordered means input sequence by its natural order; Other options:   fixed_unordered
    frames_all_limit: 720 # limit the number of sampled frames to prevent out of memory
  metric: euc # cos
  transform:
    - type: BaseSilTransform

loss_cfg:
  - loss_term_weight: 1.0
    margin: 0.2
    type: TripletLossSu # their triplet: anchor by anchor, for unbalanced batches
    log_prefix: triplet
  - loss_term_weight: 1.0
    scale: 16
    type: CrossEntropyLoss
    log_prefix: softmax
    log_accuracy: true
  # open-pair loss (lambda = 0.5) in place of Su's OpenSetLoss; same folds / gallery-probe split
  - loss_term_weight: 0.5
    type: OpenPairLoss
    num_folds: 4
    margin: 0.2 # same Euclidean space and margin as the triplet
    reduction: nonzero
    log_prefix: open_set

model_cfg:
  model: Baseline3D
  backbone_cfg:
    type: SwinGaitSu
    block_2d: BasicBlock
    block_3d: BasicBlock
    conv_3d: Conv3DSimple
    channels: [64, 128, 256, 512]
    in_channel: 1
    layers: [1, 4, 4, 2]
    strides: [1, 2, 2, 1]
    maxpool: false
    use_checkpoint: true # gradient checkpointing in the Swin layers (4 GPUs x 32 seqs; theirs: 8 x 16)
  SeparateFCs:
    in_channels: 512
    out_channels: 512
    parts_num: 15
  SeparateBNNecks:
    class_num: 3000
    in_channels: 512
    parts_num: 15
  bin_num:
    - 15
  open_set_loss: true

optimizer_cfg:
  lr: 3.0e-4
  solver: AdamW
  weight_decay: 2.0e-2

scheduler_cfg:
  t_initial: 60000
  scheduler: CosineLRScheduler

trainer_cfg:
  enable_float16: true # half_percesion float for memory reduction and speedup
  fix_BN: false
  with_test: false
  log_iter: 100
  restore_ckpt_strict: true
  restore_hint: 0
  save_iter: 10000
  save_name: SwinGait3D_Su2024_OpenPair
  sync_BN: true
  total_iter: 60000
  sampler:
    batch_shuffle: true
    batch_size:
      - 32 # TripletSampler, batch_size[0] indicates Number of Identity
      - 4 #                 batch_size[1] indicates Samples sequqnce for each Identity
    frames_num_max: 50 # max frames number for unfixed training
    frames_num_min: 10 # min frames number for unfixed training
    frames_num_per_batch: true
    frames_skip_num: 0 # skip frames number for ordered training
    sample_type: unfixed_ordered # fixed control input frames number, unordered for controlling order of input tensor; Other options: unfixed_ordered or all_ordered
    type: TripletNoRepeatSampler
  transform:
    - type: Compose
      trf_cfg:
        - type: RandomPerspective
          prob: 0.3
        - type: BaseSilTransform
        - type: RandomHorizontalFlip
          prob: 0.3
        - type: RandomRotate
          prob: 0.3
